version: "2"
run:
  tests: true
  relative-path-mode: cfg
linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - unconvert
    - errorlint
    - nilerr
    - nolintlint
    - depguard
  settings:
    errcheck:
      check-blank: true
      check-type-assertions: true
      disable-default-exclusions: true
    nolintlint:
      allow-unused: false
      require-specific: true
      require-explanation: true
    depguard:
      rules:
        public-service-surfaces:
          list-mode: strict
          files: ["$all"]
          allow:
            - $gostd
            - github.com/JustIkra/umir-factory/tests/business
            - github.com/JustIkra/umir-warehouse/contract$
            - github.com/JustIkra/umir-warehouse/bootstrap$
            - github.com/JustIkra/umir-serving/contract$
            - github.com/JustIkra/umir-serving/bootstrap$
  exclusions:
    presets: []
formatters:
  enable: [gofmt, goimports]
