version: "2"
run:
  tests: true
  relative-path-mode: cfg
linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - unconvert
    - errorlint
    - nilerr
    - nolintlint
  settings:
    errcheck:
      check-blank: true
      check-type-assertions: true
      disable-default-exclusions: true
    nolintlint:
      allow-unused: false
      require-specific: true
      require-explanation: true
  exclusions:
    presets: []
formatters:
  enable: [gofmt, goimports]
