version: "2"
run:
  tests: true
  relative-path-mode: cfg
  build-tags:
    - integration
linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - unconvert
    - errorlint
    - nilerr
    - nolintlint
    - depguard
    - bodyclose
    - forbidigo
  settings:
    errcheck:
      check-blank: true
      check-type-assertions: true
      disable-default-exclusions: true
    nolintlint:
      allow-unused: false
      require-specific: true
      require-explanation: true
    depguard:
      rules:
        production-boundaries:
          list-mode: lax
          files: ["!$test"]
          deny:
            - pkg: "github.com/JustIkra/umir-factory/tests/business"
              desc: "Assembly tooling must not depend on the composed test module."
        business-contracts:
          list-mode: strict
          files:
            - "**/tests/business/*.go"
            - "**/tests/business/**/*.go"
            - "!$test"
          allow:
            - "bytes$"
            - "context$"
            - "errors$"
            - "fmt$"
            - "math$"
            - "reflect$"
            - "slices$"
            - "strings$"
            - "testing$"
            - "time$"
            - "github.com/JustIkra/umir-warehouse/contract"
            - "github.com/JustIkra/umir-serving/contract"
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^time\.(Now|Sleep|After|AfterFunc|Tick|NewTimer|NewTicker)$'
          msg: "Inject time and scheduling dependencies into the pure core."
  exclusions:
    presets: []
    warn-unused: true
    rules:
      - linters: [forbidigo]
        path: '^(tools/assembly-checks/|tests/business/|tests/http/|reference/durable/)'
      - linters: [forbidigo]
        path: '_test\.go$'
formatters:
  enable:
    - gofmt
    - goimports
