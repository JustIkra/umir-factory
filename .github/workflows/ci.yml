name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      http_candidate:
        description: Run HTTP acceptance against four exact candidate commits
        type: boolean
        required: true
        default: false
      warehouse_ref:
        description: Full warehouse commit SHA
        type: string
        required: false
      serving_ref:
        description: Full serving commit SHA
        type: string
        required: false
      gateway_ref:
        description: Full gateway commit SHA
        type: string
        required: false
      frontend_ref:
        description: Full frontend commit SHA
        type: string
        required: false
      http_auth:
        description: Run the candidate as the one-port operator auth assembly (compose.auth.yaml)
        type: boolean
        required: false
        default: false
      feedback_ref:
        description: Optional full feedback commit SHA; requires the auth candidate
        type: string
        required: false

permissions:
  contents: read

jobs:
  check:
    name: Check assembly
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.9'
          check-latest: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
      - name: Install pinned Go quality tools
        run: make tools
      - name: Check standalone assembly-check module
        run: make check-tools
      - name: Check HTTP acceptance module
        run: make check-http
      - name: Build assembly checks
        env:
          GOWORK: 'off'
        run: |
          mkdir -p "$RUNNER_TEMP/umir-checks"
          go -C tools/assembly-checks build -o "$RUNNER_TEMP/umir-checks/umir-checks"
      - name: Validate production Compose
        run: docker compose --env-file .env.example config --quiet
      - name: Validate development Compose
        run: docker compose --env-file .env.example -f compose.yaml -f compose.dev.yaml config --quiet
      - name: Validate auth candidate Compose
        env:
          OPERATOR_PUBLIC_ORIGIN: http://127.0.0.1:8080
        run: docker compose --env-file .env.example -f compose.yaml -f compose.auth.yaml config --quiet
      - name: Check pinned image identities
        run: |
          "$RUNNER_TEMP/umir-checks/umir-checks" check-images --factory-dir "$GITHUB_WORKSPACE"
      - name: Test image verification
        run: bash tests/infra/image-checks.sh
      - name: Test assembly verification isolation and failures
        run: bash tests/infra/assembly-checks.sh
      - name: Resolve HTTP candidate, fault and auth Compose topologies
        run: bash tests/infra/http-compose-checks.sh
      - name: Test HTTP acceptance stage activation
        run: bash tests/infra/http-stage-checks.sh
      - name: Verify selected assembly
        env:
          GH_TOKEN: ${{ github.token }}
          UMIR_CHECKS_BIN: ${{ runner.temp }}/umir-checks/umir-checks
        run: bash scripts/verify-assembly.sh --env-file .env.example

  business-core:
    name: Cross-service business suite
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.9'
          check-latest: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
      - name: Build assembly checks
        env:
          GOWORK: 'off'
        run: |
          mkdir -p "$RUNNER_TEMP/umir-checks"
          go -C tools/assembly-checks build -o "$RUNNER_TEMP/umir-checks/umir-checks"
      - name: Read selected service commits from Compose
        id: selected
        run: |
          "$RUNNER_TEMP/umir-checks/umir-checks" check-images --factory-dir "$GITHUB_WORKSPACE" --github-output "$GITHUB_OUTPUT"
      - name: Run cross-service suite against selected commits
        run: >-
          "$RUNNER_TEMP/umir-checks/umir-checks" business
          --factory-dir "$GITHUB_WORKSPACE"
          --warehouse-ref "${{ steps.selected.outputs.warehouse_ref }}"
          --serving-ref "${{ steps.selected.outputs.serving_ref }}"

  http-selected:
    name: Selected HTTP acceptance
    needs: check
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.9'
          check-latest: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
      - name: Select the published HTTP assembly when enabled
        id: stage
        run: bash scripts/http-acceptance-stage.sh >> "$GITHUB_OUTPUT"
      - name: Build assembly checks
        if: steps.stage.outputs.enabled == 'true'
        env:
          GOWORK: 'off'
        run: |
          mkdir -p "$RUNNER_TEMP/umir-checks"
          go -C tools/assembly-checks build -o "$RUNNER_TEMP/umir-checks/umir-checks"
      - name: Verify selected published HTTP images
        if: steps.stage.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UMIR_HTTP_EVIDENCE_DIR: ${{ runner.temp }}/umir-http-evidence
        run: >-
          "$RUNNER_TEMP/umir-checks/umir-checks" http-acceptance
          --factory-dir "$GITHUB_WORKSPACE"
          --selected
      - name: Print selected HTTP evidence
        if: always() && steps.stage.outputs.enabled == 'true'
        run: if [[ -d "$RUNNER_TEMP/umir-http-evidence" ]]; then find "$RUNNER_TEMP/umir-http-evidence" -maxdepth 1 -type f -name '*.json' -exec cat {} \;; fi

  http-candidate:
    name: Candidate HTTP acceptance
    if: github.event_name == 'workflow_dispatch' && inputs.http_candidate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.9'
          check-latest: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
      - name: Install pinned Go quality tools
        run: make tools
      - name: Check HTTP module
        run: make check-http
      - name: Build assembly checks
        env:
          GOWORK: 'off'
        run: |
          mkdir -p "$RUNNER_TEMP/umir-checks"
          go -C tools/assembly-checks build -o "$RUNNER_TEMP/umir-checks/umir-checks"
      - name: Run exact candidate acceptance
        env:
          UMIR_HTTP_EVIDENCE_DIR: ${{ runner.temp }}/umir-http-evidence
          WAREHOUSE_REF: ${{ inputs.warehouse_ref }}
          SERVING_REF: ${{ inputs.serving_ref }}
          GATEWAY_REF: ${{ inputs.gateway_ref }}
          FRONTEND_REF: ${{ inputs.frontend_ref }}
          FEEDBACK_REF: ${{ inputs.feedback_ref }}
          CANDIDATE_AUTH: ${{ inputs.http_auth }}
        run: |
          args=(http-acceptance --factory-dir "$GITHUB_WORKSPACE" --candidate
            --warehouse-ref "$WAREHOUSE_REF" --serving-ref "$SERVING_REF"
            --gateway-ref "$GATEWAY_REF" --frontend-ref "$FRONTEND_REF")
          if [[ "$CANDIDATE_AUTH" == 'true' ]]; then args+=(--auth); fi
          if [[ -n "$FEEDBACK_REF" ]]; then args+=(--feedback-ref "$FEEDBACK_REF"); fi
          "$RUNNER_TEMP/umir-checks/umir-checks" "${args[@]}"
      - name: Print candidate HTTP evidence
        if: always()
        run: if [[ -d "$RUNNER_TEMP/umir-http-evidence" ]]; then find "$RUNNER_TEMP/umir-http-evidence" -maxdepth 1 -type f -name '*.json' -exec cat {} \;; fi

