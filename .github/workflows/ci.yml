name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check assembly
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate production Compose
        run: docker compose --env-file .env.example config --quiet
      - name: Validate development Compose
        run: docker compose --env-file .env.example -f compose.yaml -f compose.dev.yaml config --quiet
      - name: Check pinned image identities
        run: python3 scripts/check-images.py
      - name: Pull pinned images
        run: docker compose --env-file .env.example pull
      - name: Start assembly
        run: docker compose --env-file .env.example up -d --wait --wait-timeout 120
      - name: Check gateway paths
        run: python3 scripts/smoke.py
      - name: Show service logs on failure
        if: failure()
        run: docker compose --env-file .env.example logs --no-color

