              positions:
                - dishID: паста/+ &?
                  portions: "1"
                - dishID: паста/+ &?
                  portions: "2"
      responses:
        "200":
          description: Typed completed result, including exact idempotent replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderProposal"
              example:
                proposalID: proposal-1
                evaluatedAt: 2026-10-10T12:00:00+03:00
                stateVersion: "9007199254740993"
                requestedPositions:
                  - lineNo: "1"
                    dishID: паста/+ &?
                    portions: "1"
                acceptedPositions:
                  - lineNo: "1"
