      tags:
        - Warehouse
      operationId: receiveDelivery
      summary: Receive all delivery lines atomically
      x-implementation-status: implemented-http
      security:
        - operatorSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiveDeliveryRequest"
            example:
              commandID: receive-1
              deliveryID: delivery-1
              number: Поставка 42
              createdAt: 2026-10-10T12:00:00+03:00
              lines:
                - productID: сыр/+ &?
                  manufacturedAt: 2026-10-10T12:00:00+03:00
                  shelfLife:
                    value: "1"
                    unit: day
                  receivedAt: 2026-10-10T12:00:00+03:00
                  quantity: "9007199254740993"
      responses:
        "200":
          description: Typed completed result, including exact idempotent replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryReceipt"
              example:
                deliveryID: delivery-1
                batchIDs:
                  - batch-1
        "400":
          description: "InvalidArgument: invalid fields, units, precision, dates or overflow."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidArgumentError"
              example:
                code: InvalidArgument
                message: "InvalidArgument: invalid fields, units, precision, dates or overflow."
                outcome: not_committed
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "404":
          description: Referenced product or dish does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductNotFoundError"
              example:
                code: ProductNotFound
                message: Referenced product or dish does not exist.
                outcome: not_committed
        "409":
          description: Definite identity, immutable definition or unique delivery conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryConflictError"
              example:
                code: CommandIdentityConflict
                message: Definite identity, immutable definition or unique delivery conflict.
                outcome: not_committed
        "500":
          description: Technical failure with unknown write outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteTechnicalError"
              example:
                code: InternalError
                message: Technical failure with unknown write outcome.
                outcome: unknown
        "502":
          description: Upstream unavailable or transport failure; outcome unknown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayWriteError"
              example:
                code: UpstreamUnavailable
                message: Upstream unavailable or transport failure; outcome unknown.
                outcome: unknown
        "503":
          description: Inventory is unavailable; the operation outcome remains unknown. This status does not
            establish a terminal refusal.
            In the auth assembly, fail-closed recovery answers OperatorError AuthUnavailable without dispatch.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/InventoryUnavailableError"
                  - $ref: "#/components/schemas/OperatorError"
              example:
                code: InventoryUnavailable
                message: Inventory is unavailable; the operation outcome remains unknown.
                outcome: unknown
        "504":
          description: Upstream timeout; outcome unknown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayWriteError"
              example:
                code: UpstreamTimeout
                message: Upstream timeout; outcome unknown.
                outcome: unknown
  /api/operator/csrf:
    get:
      tags:
        - Operator
      operationId: getCsrfToken
      summary: CSRF token of the session, or of an anonymous context for sign-in and logout
      x-implementation-status: implemented-candidate
      description: With a live session cookie returns that session's token. Otherwise returns the token of an
        anonymous context and sets its pre-auth cookie (__Host-umir_operator_preauth, or umir_operator_preauth in
        loopback-development mode); an existing live context keeps its token. Never creates or extends a session.
        Works during recovery.
      responses:
        "200":
          description: CSRF token. Send it in X-CSRF-Token with the exact Origin on unsafe requests.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Set-Cookie:
              description: Pre-auth cookie of a new anonymous context; HttpOnly, SameSite=Strict, Path=/.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfTokenView"
              example:
                csrfToken: 3S7yQ0bS9u6m0f5aZr2kVw
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
        "502":
          $ref: "#/components/responses/GatewayReadUnavailable"
        "504":
          $ref: "#/components/responses/GatewayReadTimeout"
  /api/operator/session:
    post:
      tags:
        - Operator
      operationId: signIn
      summary: Sign in and open a session
      x-implementation-status: implemented-candidate
      description: Needs the exact Origin and the anonymous context's token with its pre-auth cookie (or a live
        session's token). A successful login replaces the previous session of the request, stores the new session
        before the cookie is set and sets the session cookie (__Host-umir_operator_session, or
        umir_operator_session in loopback-development mode; HttpOnly, SameSite=Strict, Path=/). An ordinary session
        lasts 30 minutes idle and 8 hours from login; rememberMe=true gives a fixed 30-day session whose cookie has
        Expires and Max-Age. Every credential mismatch is the same InvalidCredentials. Five failed logins within 60
        seconds start a 60-second cooldown for every login.
      security:
        - operatorPreauth: []
          csrfToken: []
        - operatorSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
            example:
              login: operator
              password: correct horse battery
              rememberMe: false
      responses:
        "200":
          description: Signed in. The body never contains the session ID.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Set-Cookie:
              description: The new session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorView"
              example:
                operator:
                  id: 7KB6W3EHBMZKTKVRO44KR6KSVH
                  login: operator
                  displayName: Оператор
                session:
                  expiresAt: 2026-10-12T12:30:00+03:00
                  idleExpiresAt: 2026-10-12T12:30:00+03:00
                  absoluteExpiresAt: 2026-10-12T20:00:00+03:00
                  rememberMe: false
                  csrfToken: Yb8m1u3n5LwqS0dZr9tKcA
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          description: InvalidCredentials. Login or password is wrong; the answer does not say which.
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/WWW-Authenticate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorError"
              example:
                code: InvalidCredentials
                message: login or password is incorrect
                requestID: 7KB6W3EHBMZKTKVRO44KR6KSVH
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          description: LoginRateLimited. The login cooldown is active or the password check queue is full.
          headers:
            Retry-After:
              $ref: "#/components/headers/Retry-After"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorError"
              example:
                code: LoginRateLimited
                message: too many login attempts
                requestID: 7KB6W3EHBMZKTKVRO44KR6KSVH
        "503":
          $ref: "#/components/responses/SessionUnavailable"
        "502":
          $ref: "#/components/responses/GatewayWriteUnavailable"
        "504":
          $ref: "#/components/responses/GatewayWriteTimeout"
    delete:
      tags:
        - Operator
      operationId: signOut
      summary: Log out
      x-implementation-status: implemented-candidate
      description: Idempotent. A live session needs its token; without one, use the token of a fresh anonymous
        context. The revocation is stored before 204; an absent or expired session needs nothing stored. During
        recovery only a request without a session cookie can succeed.
      security:
        - operatorSession: []
          csrfToken: []
        - operatorPreauth: []
          csrfToken: []
      responses:
        "204":
          description: Logged out; the session cookie is cleared.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Set-Cookie:
              description: Clears the session cookie.
              schema:
                type: string
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/SessionUnavailable"
        "502":
          $ref: "#/components/responses/GatewayWriteUnavailable"
        "504":
          $ref: "#/components/responses/GatewayWriteTimeout"
  /api/operator/me:
    get:
      tags:
        - Operator
      operationId: getCurrentOperator
      summary: The operator's own view and session deadlines
      x-implementation-status: implemented-candidate
      description: Stores an ordinary session's renewed idle deadline before reporting it. If the store definitely
        fails, answers 200 with the deadline the store already holds. Use it to resolve a lost display-name answer.
      security:
        - operatorSession: []
      responses:
        "200":
          description: Same object as sign-in.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorView"
              example:
                operator:
                  id: 7KB6W3EHBMZKTKVRO44KR6KSVH
                  login: operator
                  displayName: Оператор
                session:
                  expiresAt: 2026-10-12T12:45:00+03:00
                  idleExpiresAt: 2026-10-12T12:45:00+03:00
                  absoluteExpiresAt: 2026-10-12T20:00:00+03:00
                  rememberMe: false
                  csrfToken: Yb8m1u3n5LwqS0dZr9tKcA
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
