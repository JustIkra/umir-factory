          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorProfileView"
              example:
                operator:
                  id: 7KB6W3EHBMZKTKVRO44KR6KSVH
                  login: operator
                  displayName: Смена 2
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: InvalidDisplayName with the reason in fieldErrors.displayName.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorError"
              example:
                code: InvalidDisplayName
                message: display name must contain 2 to 80 characters without control characters
                fieldErrors:
                  displayName: TooShort
                requestID: 7KB6W3EHBMZKTKVRO44KR6KSVH
        "503":
          $ref: "#/components/responses/AccountUnavailable"
        "502":
          $ref: "#/components/responses/GatewayWriteUnavailable"
        "504":
          $ref: "#/components/responses/GatewayWriteTimeout"
  /api/operator/me/password:
    patch:
      tags:
        - Operator
      operationId: changePassword
      summary: Change the password and end every session
      x-implementation-status: implemented-candidate
      description: The new password must contain 8 to 32 Unicode code points; neither password is trimmed or
        normalized. An active cooldown answers 429 before field validation. Otherwise newPassword is validated
        first. If it is valid, a currentPassword longer than 32 code points answers 422 PasswordRejected with
        fieldErrors.currentPassword=TooLong before credential verification; it does not count as a failed check
        or revoke a session.
        Success stores the new verifier, revokes every session including this one and clears its cookie; sign in
        again. Actual wrong current-password verifications 1 to 4 within 60 seconds, counted for the whole operator,
        answer 403 CurrentPasswordIncorrect. The fifth revokes only the calling session and starts a 60-second cooldown in
        which every change is refused before any password check. A successful change clears the count.
      security:
        - operatorSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeRequest"
            example:
              currentPassword: correct horse battery
              newPassword: another long phrase
      responses:
        "204":
          description: Password changed; every session is revoked and this session's cookie is cleared.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Set-Cookie:
              description: Clears the session cookie.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: InvalidOrigin or InvalidCsrfToken, or CurrentPasswordIncorrect (wrong current password 1 to 4,
            nothing changed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorError"
              example:
                code: CurrentPasswordIncorrect
                message: current password is incorrect
                requestID: 7KB6W3EHBMZKTKVRO44KR6KSVH
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: PasswordRejected with the reason in fieldErrors.currentPassword or fieldErrors.newPassword.
            Outside an active cooldown, newPassword is validated first; currentPassword TooLong is returned when the
            new password is valid. Invalid current-password length does not consume the wrong-password counter or
            revoke a session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorError"
              examples:
                currentPasswordTooLong:
                  value:
                    code: PasswordRejected
                    message: password field is invalid
                    fieldErrors:
                      currentPassword: TooLong
                    requestID: 7KB6W3EHBMZKTKVRO44KR6KSVH
                newPasswordTooShort:
                  value:
                    code: PasswordRejected
                    message: password field is invalid
                    fieldErrors:
                      newPassword: TooShort
                    requestID: 7KB6W3EHBMZKTKVRO44KR6KSVH
        "429":
          description: PasswordChangeRateLimited; the password did not change. sessionRevoked=true means this
            response revoked the calling session, stored the revocation and cleared its cookie; sign in again.
            sessionRevoked=false means this response revoked nothing and only password changes wait. A revocation
            that was not stored answers 503 instead, and the cooldown has started anyway.
          headers:
            Retry-After:
              $ref: "#/components/headers/Retry-After"
            Set-Cookie:
              description: Clears the session cookie when sessionRevoked is true.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorError"
              example:
                code: PasswordChangeRateLimited
                message: too many wrong current passwords; password changes are paused
                requestID: 7KB6W3EHBMZKTKVRO44KR6KSVH
                sessionRevoked: true
        "503":
          $ref: "#/components/responses/AccountUnavailable"
        "502":
          $ref: "#/components/responses/GatewayWriteUnavailable"
        "504":
          $ref: "#/components/responses/GatewayWriteTimeout"
  /api/feedback:
    post:
      tags:
        - Feedback
      operationId: submitFeedback
      summary: Submit the public feedback form
      x-implementation-status: implemented-candidate
      description: Public; no operator session is needed and none is extended. Gateway checks the exact Origin and
        Sec-Fetch-Site, the X-CSRF-Token of the operator's session or of an anonymous context from
        /api/operator/csrf, 5 posts per 10 minutes per CSRF context and 60 per 10 minutes per gateway process, and a
        single JSON object of at most 16 KiB. It then sends POST /feedback to the private umir-feedback service
        without cookies, X-CSRF-Token or the query and returns the service's answer unchanged. Gateway never
        retries; after a timeout or disconnect repeat the same submissionID and content. The service validates and
        stores the content (umir-feedback#1); the service answers are implemented by the feedback candidate.
      security:
        - operatorPreauth: []
          csrfToken: []
        - operatorSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackSubmission"
            example:
              submissionID: 2f6b7c1e-4a3d-4e8b-9c2a-1d5e6f7a8b9c
              name: Анна
              email: anna@example.ru
              message: Спасибо за обед!
              consent:
                accepted: true
                documentVersion: "2026-10-12"
              website: ""
      responses:
        "200":
          description: The same retained submission ID and normalized content was already stored. No notification jobs are created again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackReceipt"
              example:
                submissionID: 2f6b7c1e-4a3d-4e8b-9c2a-1d5e6f7a8b9c
                receivedAt: 2026-10-12T12:00:00+03:00
        "201":
          description: The service stored the submission and its two notification jobs; delivery is not confirmed. A non-empty website instead returns this acknowledgement without storage or jobs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackReceipt"
              example:
                submissionID: 2f6b7c1e-4a3d-4e8b-9c2a-1d5e6f7a8b9c
                receivedAt: 2026-10-12T12:00:00+03:00
        "400":
          description: The JSON body or submission ID is invalid. This can be rejected by the gateway or by umir-feedback.
          content:
            application/json:
              schema:
                allOf:
                  - anyOf:
                      - $ref: "#/components/schemas/OperatorError"
                      - $ref: "#/components/schemas/FeedbackError"
                  - properties:
                      code:
                        const: InvalidRequest
              example:
                code: InvalidRequest
                message: InvalidRequest
                requestID: 0123456789abcdef0123456789abcdef
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "409":
          description: The submission ID is already stored with different normalized content. No new request or jobs are created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackError"
              example:
                code: SubmissionIdentityConflict
                message: SubmissionIdentityConflict
                requestID: 0123456789abcdef0123456789abcdef
        "422":
          description: Feedback fields are invalid, consent is missing, or the consent document version is outdated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackError"
              example:
                code: InvalidFeedback
                message: InvalidFeedback
                fieldErrors:
                  email: InvalidFormat
                requestID: 0123456789abcdef0123456789abcdef
        "429":
          description: FeedbackRateLimited. The CSRF context or the gateway used up its posts in the window.
          headers:
            Retry-After:
              $ref: "#/components/headers/Retry-After"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorError"
              example:
                code: FeedbackRateLimited
                message: too many feedback posts
                requestID: 7KB6W3EHBMZKTKVRO44KR6KSVH
        "503":
          description: Storage did not confirm the intake write, or the gateway cannot validate the CSRF context. Repeat an unconfirmed submission with the same ID and content.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/FeedbackError"
                  - $ref: "#/components/schemas/OperatorError"
              example:
                code: FeedbackStorageUnavailable
                message: FeedbackStorageUnavailable
                requestID: 0123456789abcdef0123456789abcdef
        "502":
          description: The service did not answer; the outcome is unknown. Repeat with the same submissionID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayWriteError"
              example:
                code: UpstreamUnavailable
                message: upstream service did not respond
                outcome: unknown
        "504":
          description: The service did not answer in time; the outcome is unknown. Repeat with the same submissionID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayWriteError"
              example:
                code: UpstreamTimeout
                message: upstream service did not respond in time
                outcome: unknown
