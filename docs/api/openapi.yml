openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Umir gateway API
  version: 1.0.0-draft.1
  description: "Target wire contract v1 for frontend → gateway → scenario HTTP mocks. Business HTTP adapters are
    not implemented by the current core; only health routes are available. Production integration requires
    authoritative resolution, protection against late writes and restart recovery. Definitions are immutable;
    editing, history pagination, document upload/OCR, auth, roles and multiple restaurants are outside this
    version. All request/response business bodies use application/json. Unknown tagged results and invalid
    response bodies are protocol failures, never proof of a sale. API revision is separate from service
    releases and exact factory image SHA pins. Source rules: [gateway
    handoff](https://github.com/JustIkra/umir-factory/blob/2a60ea2b00f1586bceeacaa8b2c8d37806c7e310/docs/gate\
    way-frontend-handoff.md) and [business
    core](https://github.com/JustIkra/umir-factory/blob/2a60ea2b00f1586bceeacaa8b2c8d37806c7e310/docs/busines\
    s-core.md)."
servers:
  - url: /
    description: Same-origin gateway via frontend reverse proxy.
  - url: http://127.0.0.1:8081
    description: Default local gateway address. Business paths are targets until mocks/adapters are installed.
security: []
tags:
  - name: Catalog
    description: Immutable product and dish definitions.
  - name: Availability
    description: Independent warehouse evaluations, with captured time and version.
  - name: Orders
    description: Immutable proposals and explicit confirmation.
  - name: Warehouse
    description: Atomic delivery intake, prepared stock and recorded history.
  - name: Health
    description: Process health only.
x-wire-version: 1
x-timezone: Europe/Moscow
x-core-source-revisions:
  warehouse: a4dccd27453fad62efb3df1f929aa720521b0c78
  serving: 6ddcfbceedf7df82e1deed7700a4a52c635bef62
x-adapter-rules:
  - Normalize serving Recipe to wire ingredients and serving Order.Positions to acceptedPositions. History
    uses recorded fields, not enriched DTOs.
  - Convert int/int64 to canonical decimal strings with checked range conversion. Omitted optional ingredient
    baseUnit maps to the empty Go hint.
  - Encode all required empty collections as []; do not emit null. Reject unknown/inactive payload fields.
  - Gateway strips /api/serving or /api/warehouse and preserves method, remaining path, query, body,
    end-to-end headers and received upstream status/body. Gateway does not calculate business decisions,
    fingerprints or command IDs.
  - Service error codes are stable PascalCase wire values, not Go error text. Inspect payload and explicit
    outcome. Only the operation owner may establish not_committed; transport failure remains unknown for every
    POST.
  - A schema cannot prove relational business invariants, product uniqueness by key, time ordering, aggregate
    overflow, FEFO or late-write prevention. Owners must check these documented conditions.
paths:
  /api/serving/products:
    get:
      tags:
        - Catalog
      operationId: getProducts
      summary: List all registered products
      x-implementation-status: target-http-contract
      responses:
        "200":
          description: Typed successful result. Empty collections remain JSON arrays.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Products"
              example:
                evaluatedAt: 2026-10-10T12:00:00+03:00
                stateVersion: "9007199254740993"
                items:
                  - productID: сыр/+ &?
                    name: Сыр
                    baseUnit: g
        "500":
          description: Unexpected service failure; no successful query result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadTechnicalError"
              example:
                code: InternalError
                message: Unexpected service failure; no successful query result.
                outcome: unavailable
        "502":
          description: Upstream unavailable or transport/protocol failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayReadError"
              example:
                code: UpstreamUnavailable
                message: Upstream unavailable or transport/protocol failure.
                outcome: unavailable
        "503":
          description: Current inventory/definition version cannot be prepared or read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadUnavailableError"
              example:
                code: InventoryUnavailable
                message: Current inventory/definition version cannot be prepared or read.
                outcome: unavailable
        "504":
          description: Finite upstream timeout.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayReadError"
              example:
                code: UpstreamTimeout
                message: Finite upstream timeout.
                outcome: unavailable
    post:
      tags:
        - Catalog
      operationId: registerProduct
      summary: Register an immutable product
      x-implementation-status: target-http-contract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterProductRequest"
            example:
              commandID: register-1
              productID: сыр/+ &?
              name: Сыр
              baseUnit: g
      responses:
        "200":
          description: Typed completed result, including exact idempotent replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
              example:
                productID: сыр/+ &?
                name: Сыр
                baseUnit: g
        "400":
          description: "InvalidArgument: invalid fields, units, precision, dates or overflow."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidArgumentError"
              example:
                code: InvalidArgument
                message: "InvalidArgument: invalid fields, units, precision, dates or overflow."
                outcome: not_committed
        "409":
          description: Definite identity, immutable definition or unique delivery conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductConflictError"
              example:
                code: CommandIdentityConflict
                message: Definite identity, immutable definition or unique delivery conflict.
                outcome: not_committed
        "500":
          description: Technical failure with unknown write outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteTechnicalError"
              example:
                code: InternalError
                message: Technical failure with unknown write outcome.
                outcome: unknown
        "502":
          description: Upstream unavailable or transport failure; outcome unknown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayWriteError"
              example:
                code: UpstreamUnavailable
                message: Upstream unavailable or transport failure; outcome unknown.
                outcome: unknown
        "503":
          description: InventoryUnavailable; use explicit outcome, not status alone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryUnavailableError"
              example:
                code: InventoryUnavailable
                message: InventoryUnavailable; use explicit outcome, not status alone.
                outcome: not_committed
        "504":
          description: Upstream timeout; outcome unknown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayWriteError"
              example:
                code: UpstreamTimeout
                message: Upstream timeout; outcome unknown.
                outcome: unknown
