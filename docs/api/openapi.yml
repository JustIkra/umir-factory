        commandFingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
        recordedAt:
          $ref: "#/components/schemas/MoscowTimestamp"
        type:
          type: string
          const: OrderPlaced
        payload:
          type: object
          additionalProperties: false
          required:
