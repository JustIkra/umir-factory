      type: apiKey
      in: cookie
      name: __Host-umir_operator_session
      description: Opaque server session of the single operator, set by sign-in; HttpOnly, SameSite=Strict, Path=/,
        Secure. In loopback-development mode the cookie is umir_operator_session without Secure. The gateway
        stores only a digest of it. Never send it to services or keep it in browser storage.
    operatorPreauth:
      type: apiKey
      in: cookie
      name: __Host-umir_operator_preauth
      description: Opaque anonymous CSRF context set by GET /api/operator/csrf without a live session; HttpOnly,
        SameSite=Strict, Path=/, Secure. In loopback-development mode the cookie is umir_operator_preauth without
        Secure. Its token is accepted only together with this cookie; sign-in clears it.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Synchronizer token of the session (from sign-in, /me or /csrf) or of an anonymous context (from
        /csrf with its pre-auth cookie). Every unsafe request also sends the exact configured Origin.
  headers:
    Retry-After:
      required: true
      description: Whole seconds, at least 1, until another attempt can succeed.
      schema:
        type: integer
        minimum: 1
    WWW-Authenticate:
      description: Session realm="umir-operator" on every 401; browsers show no sign-in prompt for this scheme.
      schema:
        type: string
        const: Session realm="umir-operator"
    NoStore:
      description: Every answer of the operator routes, success or error, carries Cache-Control no-store.
      schema:
        type: string
        const: no-store
  responses:
    GatewayReadUnavailable:
      description: The frontend proxy could not obtain the gateway response. No query result is available.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GatewayReadError"
          example:
            code: UpstreamUnavailable
            message: gateway did not respond
            outcome: unavailable
    GatewayReadTimeout:
      description: The frontend proxy did not obtain the gateway response in time. No query result is available.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GatewayReadError"
          example:
            code: UpstreamTimeout
            message: gateway did not respond in time
            outcome: unavailable
    GatewayWriteUnavailable:
      description: The frontend proxy could not obtain the gateway response. The operation may have committed;
        its outcome is unknown. Do not assume that the account or session is unchanged.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GatewayWriteError"
          example:
            code: UpstreamUnavailable
            message: gateway did not respond
            outcome: unknown
    GatewayWriteTimeout:
      description: The frontend proxy did not obtain the gateway response in time. The operation may have
        committed; its outcome is unknown. Do not assume that the account or session is unchanged.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GatewayWriteError"
          example:
            code: UpstreamTimeout
            message: gateway did not respond in time
            outcome: unknown
    Unauthenticated:
      description: Unauthenticated. No live operator session; nothing was dispatched. Sign in and repeat.
      headers:
        WWW-Authenticate:
          $ref: "#/components/headers/WWW-Authenticate"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OperatorError"
          example:
            code: Unauthenticated
            message: sign in to continue
            requestID: 7KB6W3EHBMZKTKVRO44KR6KSVH
    CsrfRejected:
      description: InvalidOrigin (missing or foreign Origin, or cross-site Fetch Metadata) or InvalidCsrfToken
        (missing or wrong X-CSRF-Token). Nothing was dispatched.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OperatorError"
          example:
            code: InvalidCsrfToken
            message: CSRF token is missing or invalid
            requestID: 7KB6W3EHBMZKTKVRO44KR6KSVH
    InvalidRequest:
      description: InvalidRequest. The body is not the expected JSON object, including invalid UTF-8, an unpaired
        surrogate escape, unknown or wrong-case fields, duplicate object keys, null field values or data after
        the object. Account request fields use exact case-sensitive names.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OperatorError"
          example:
            code: InvalidRequest
            message: request body is not the expected JSON object
            requestID: 7KB6W3EHBMZKTKVRO44KR6KSVH
    MethodNotAllowed:
      description: MethodNotAllowed, with the supported methods in Allow.
      headers:
        Allow:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OperatorError"
          example:
            code: MethodNotAllowed
            message: method is not allowed for this route
            requestID: 7KB6W3EHBMZKTKVRO44KR6KSVH
    PayloadTooLarge:
      description: PayloadTooLarge. Account bodies take at most 8 KiB, the feedback form 16 KiB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OperatorError"
          example:
            code: PayloadTooLarge
            message: request body is too large
            requestID: 7KB6W3EHBMZKTKVRO44KR6KSVH
    UnsupportedMediaType:
      description: UnsupportedMediaType. Send the body as application/json.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OperatorError"
          example:
            code: UnsupportedMediaType
            message: send the body as application/json
            requestID: 7KB6W3EHBMZKTKVRO44KR6KSVH
    AuthUnavailable:
      description: AuthUnavailable. Fail-closed recovery after an unknown account or session write, or an
        unexpected failure; a controlled restart reloads the account file.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OperatorError"
          example:
            code: AuthUnavailable
            message: authentication is unavailable until the account is recovered
            requestID: 7KB6W3EHBMZKTKVRO44KR6KSVH
    SessionUnavailable:
      description: AuthUnavailable during recovery; SessionStorageUnavailable when a session change definitely was
        not stored (nothing changed, no cookie set or cleared); SessionUpdateOutcomeUnknown when the write outcome
        is unknown (the gateway enters recovery).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OperatorError"
          example:
            code: SessionStorageUnavailable
            message: session storage failed; the session was not changed
            requestID: 7KB6W3EHBMZKTKVRO44KR6KSVH
    AccountUnavailable:
      description: AccountStorageUnavailable when the account file was not replaced (nothing changed, sessions keep
        working); AccountUpdateOutcomeUnknown when the outcome is unknown (the gateway enters recovery; resolve a
        display name with /me after restart and a password by signing in); SessionStorageUnavailable or
        SessionUpdateOutcomeUnknown when a session revocation of the password change limit was not stored;
        AuthUnavailable during recovery.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OperatorError"
          example:
            code: AccountStorageUnavailable
            message: account storage failed; nothing was changed
            requestID: 7KB6W3EHBMZKTKVRO44KR6KSVH
  schemas:
    ID:
      type: string
      minLength: 1
      description: Opaque identifier. Unicode and reserved characters are allowed. Percent-encode query values; do
        not require UUID syntax.
    ClientCommandID:
      type: string
      minLength: 1
      not:
        pattern: ^expiration/
      description: Caller-generated command identity. Preserve the same value and identical input on retry. The
        expiration/ namespace belongs to warehouse.
    PositiveInt64:
      type: string
      minLength: 1
      maxLength: 19
      pattern: ^(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$
      description: Canonical decimal integer from 1 through 9223372036854775807. No sign, leading zero, exponent or
        fractional part. Keep as a string or BigInt in JavaScript.
      examples:
        - "1"
        - "9007199254740993"
        - "9223372036854775807"
    NonNegativeInt64:
      type: string
      minLength: 1
      maxLength: 19
      pattern: ^(?:0|[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$
      description: Canonical decimal integer from 0 through 9223372036854775807. Preserve exact precision.
      examples:
        - "0"
        - "9007199254740993"
        - "9223372036854775807"
    PositiveQuantity:
      $ref: "#/components/schemas/PositiveInt64"
      description: Positive thousandths of the product base unit. "40000" is 40 g/ml/pcs; "500" is 0.5 g/ml/pcs.
    Quantity:
      $ref: "#/components/schemas/NonNegativeInt64"
      description: Nonnegative thousandths of the product base unit. "10000000" is 10 kg for baseUnit=g.
    MoscowTimestamp:
      type: string
      format: date-time
      pattern: ^\d{4}-\d{2}-\d{2}T(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.[0-9]{1,9})?\+03:00$
      description: Full RFC3339 timestamp with seconds and the +03:00 Moscow offset. Calendar dates must be valid.
        Date-only, Z, other offsets and leap seconds are rejected. Explicit midnight is valid.
      examples:
        - 2026-10-10T12:00:00+03:00
        - 2026-10-10T00:00:00+03:00
    BaseUnit:
      type: string
      enum:
        - g
        - ml
        - pcs
    ShelfLife:
      type: object
      description: day is exactly 24 hours. month uses the Moscow calendar and clips the day to the end of the
        target month. Warehouse calculates expiresAt once; duration/date overflow is InvalidArgument.
      additionalProperties: false
      required:
        - value
        - unit
      properties:
        value:
          $ref: "#/components/schemas/PositiveInt64"
        unit:
          type: string
          enum:
            - day
            - month
    Product:
      type: object
      additionalProperties: false
      required:
        - productID
        - name
        - baseUnit
      properties:
        productID:
          $ref: "#/components/schemas/ID"
        name:
          type: string
          minLength: 1
        baseUnit:
          $ref: "#/components/schemas/BaseUnit"
    IngredientInput:
      type: object
      additionalProperties: false
      required:
        - productID
        - quantity
      properties:
        productID:
          $ref: "#/components/schemas/ID"
        quantity:
          $ref: "#/components/schemas/PositiveQuantity"
        baseUnit:
          $ref: "#/components/schemas/BaseUnit"
          description: Optional assertion. If supplied, it must match the registered product. Omission lets warehouse
            obtain its base unit.
    Ingredient:
      type: object
      additionalProperties: false
      required:
        - productID
        - quantity
        - baseUnit
      properties:
        productID:
          $ref: "#/components/schemas/ID"
        quantity:
          $ref: "#/components/schemas/PositiveQuantity"
        baseUnit:
          $ref: "#/components/schemas/BaseUnit"
    RecordedIngredient:
      type: object
      additionalProperties: false
      required:
        - productID
        - quantity
      properties:
        productID:
          $ref: "#/components/schemas/ID"
        quantity:
          $ref: "#/components/schemas/PositiveQuantity"
    Dish:
      type: object
      description: Immutable definition. Ingredients remain in recipe order. Each productID occurs once. Wire
        ingredients maps to serving Recipe and warehouse Ingredients.
      additionalProperties: false
      required:
        - dishID
        - name
        - ingredients
      properties:
        dishID:
          $ref: "#/components/schemas/ID"
        name:
          type: string
          minLength: 1
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/Ingredient"
          minItems: 1
    RecordedDish:
      type: object
      description: Definition stored in the event. Base units belong to ProductRegistered facts; history does not
        enrich or reinterpret recorded data.
      additionalProperties: false
      required:
        - dishID
        - name
        - ingredients
      properties:
        dishID:
          $ref: "#/components/schemas/ID"
        name:
          type: string
          minLength: 1
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/RecordedIngredient"
          minItems: 1
    RegisterProductRequest:
      type: object
      additionalProperties: false
      required:
        - commandID
        - productID
        - name
        - baseUnit
      properties:
        commandID:
          $ref: "#/components/schemas/ClientCommandID"
        productID:
          $ref: "#/components/schemas/ID"
        name:
          type: string
          minLength: 1
        baseUnit:
          $ref: "#/components/schemas/BaseUnit"
    DefineDishRequest:
      type: object
      description: Creates a definition without replacing an existing dish. Ingredient productID values must be
        distinct and refer to registered products.
      additionalProperties: false
      required:
        - commandID
        - dishID
        - name
        - ingredients
      properties:
        commandID:
          $ref: "#/components/schemas/ClientCommandID"
        dishID:
          $ref: "#/components/schemas/ID"
        name:
          type: string
          minLength: 1
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/IngredientInput"
          minItems: 1
    MenuDish:
      type: object
      additionalProperties: false
      required:
        - dishID
        - name
      properties:
        dishID:
          $ref: "#/components/schemas/ID"
        name:
          type: string
          minLength: 1
    Deficit:
      type: object
      description: Required and available quantities at this position evaluation. availableQuantity is less than
        requiredQuantity.
      additionalProperties: false
      required:
        - productID
        - requiredQuantity
        - availableQuantity
      properties:
        productID:
          $ref: "#/components/schemas/ID"
        requiredQuantity:
          $ref: "#/components/schemas/PositiveQuantity"
        availableQuantity:
          $ref: "#/components/schemas/Quantity"
    StopListDish:
      type: object
      additionalProperties: false
      required:
        - dishID
        - name
        - deficits
      properties:
        dishID:
          $ref: "#/components/schemas/ID"
        name:
          type: string
          minLength: 1
        deficits:
          type: array
          items:
            $ref: "#/components/schemas/Deficit"
          minItems: 1
    RequestedPosition:
      type: object
      description: Input position. Serving assigns lineNo=1,2,... in array order. Repeated dishID values are allowed.
      additionalProperties: false
      required:
        - dishID
        - portions
      properties:
        dishID:
          $ref: "#/components/schemas/ID"
        portions:
          $ref: "#/components/schemas/PositiveInt64"
    Position:
      type: object
      description: Position with the original service-assigned line number. Do not renumber reductions or replacements.
      additionalProperties: false
      required:
        - lineNo
        - dishID
        - portions
      properties:
        lineNo:
          $ref: "#/components/schemas/PositiveInt64"
        dishID:
          $ref: "#/components/schemas/ID"
        portions:
          $ref: "#/components/schemas/PositiveInt64"
    Change:
      type: object
      description: One reduction or removal. acceptedPortions is less than requestedPortions; zero denotes removal.
        Changes retain input order.
      additionalProperties: false
      required:
        - lineNo
        - dishID
        - requestedPortions
        - acceptedPortions
        - deficits
      properties:
        lineNo:
          $ref: "#/components/schemas/PositiveInt64"
        dishID:
          $ref: "#/components/schemas/ID"
        requestedPortions:
          $ref: "#/components/schemas/PositiveInt64"
        acceptedPortions:
          $ref: "#/components/schemas/NonNegativeInt64"
        deficits:
          type: array
          items:
            $ref: "#/components/schemas/Deficit"
          minItems: 1
    Allocation:
      type: object
      description: Exact committed debit. Contains only recorded product/batch identity and quantity, without
        display enrichment.
      additionalProperties: false
      required:
        - productID
        - batchID
        - quantity
      properties:
        productID:
          $ref: "#/components/schemas/ID"
        batchID:
          $ref: "#/components/schemas/ID"
        quantity:
          $ref: "#/components/schemas/PositiveQuantity"
    Order:
      type: object
      description: Authoritative recorded order. Wire acceptedPositions maps to serving Order.Positions and
        warehouse Order.AcceptedPositions.
      additionalProperties: false
      required:
        - orderID
        - proposalID
        - acceptedPositions
        - allocations
        - placedAt
      properties:
        orderID:
          $ref: "#/components/schemas/ID"
        proposalID:
          $ref: "#/components/schemas/ID"
        acceptedPositions:
          type: array
          items:
            $ref: "#/components/schemas/Position"
          minItems: 1
        allocations:
          type: array
          items:
            $ref: "#/components/schemas/Allocation"
          minItems: 1
        placedAt:
          $ref: "#/components/schemas/MoscowTimestamp"
    OrderProposal:
      type: object
      description: Immutable proposal; preparation does not reserve or debit inventory. Empty acceptedPositions is
        valid. Replacements use the preceding acceptedPositions as requestedPositions, retain lineNo and never
        increase portions or restore removed positions.
      additionalProperties: false
      required:
        - proposalID
        - evaluatedAt
        - stateVersion
        - requestedPositions
        - acceptedPositions
        - changes
      properties:
        proposalID:
          $ref: "#/components/schemas/ID"
        evaluatedAt:
          $ref: "#/components/schemas/MoscowTimestamp"
        stateVersion:
          $ref: "#/components/schemas/NonNegativeInt64"
        requestedPositions:
          type: array
          items:
            $ref: "#/components/schemas/Position"
          minItems: 0
        acceptedPositions:
          type: array
          items:
            $ref: "#/components/schemas/Position"
          minItems: 0
        changes:
          type: array
          items:
            $ref: "#/components/schemas/Change"
          minItems: 0
    PrepareOrderRequest:
      type: object
      description: Process positions in source order. An empty list produces an empty proposal. Do not send lineNo
        or an accepted composition.
      additionalProperties: false
      required:
        - positions
      properties:
        positions:
          type: array
          items:
            $ref: "#/components/schemas/RequestedPosition"
          minItems: 0
    ConfirmOrderRequest:
      type: object
      description: Confirm only the saved accepted composition. Preserve both identities and the same JSON values
        after an unknown outcome. A replacement requires explicit user confirmation and a new commandID.
      additionalProperties: false
      required:
        - commandID
        - proposalID
      properties:
        commandID:
          $ref: "#/components/schemas/ClientCommandID"
        proposalID:
          $ref: "#/components/schemas/ID"
    DeliveryLine:
      type: object
      description: One source line creates one batch. manufacturedAt <= receivedAt <= operation time. Line numbers
        and batchIDs are assigned by warehouse; expiresAt is not caller input.
      additionalProperties: false
      required:
        - productID
        - manufacturedAt
        - shelfLife
        - receivedAt
        - quantity
      properties:
        productID:
          $ref: "#/components/schemas/ID"
        manufacturedAt:
          $ref: "#/components/schemas/MoscowTimestamp"
        shelfLife:
          $ref: "#/components/schemas/ShelfLife"
        receivedAt:
          $ref: "#/components/schemas/MoscowTimestamp"
        quantity:
          $ref: "#/components/schemas/PositiveQuantity"
    ReceiveDeliveryRequest:
      type: object
      description: Validate the entire delivery before intake facts. deliveryID is unique independently of
        commandID. Exact retries return the original receipt; a new commandID for the same deliveryID is a
        conflict. Already expired intake is atomically received and written off.
      additionalProperties: false
      required:
        - commandID
        - deliveryID
        - number
        - createdAt
        - lines
      properties:
        commandID:
          $ref: "#/components/schemas/ClientCommandID"
        deliveryID:
          $ref: "#/components/schemas/ID"
        number:
          type: string
          minLength: 1
          description: Delivery number, displayed as Номер поставки. It is not unique.
        createdAt:
          $ref: "#/components/schemas/MoscowTimestamp"
          description: Date and time of delivery creation (Дата и время создания поставки). Required and no later than
            operation time.
        lines:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryLine"
          minItems: 1
    Delivery:
      type: object
      additionalProperties: false
      required:
        - deliveryID
        - number
        - createdAt
        - lines
      properties:
        deliveryID:
          $ref: "#/components/schemas/ID"
        number:
          type: string
          minLength: 1
        createdAt:
          $ref: "#/components/schemas/MoscowTimestamp"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryLine"
          minItems: 1
    DeliveryReceipt:
      type: object
      additionalProperties: false
      required:
        - deliveryID
        - batchIDs
      properties:
        deliveryID:
          $ref: "#/components/schemas/ID"
        batchIDs:
          type: array
          items:
            $ref: "#/components/schemas/ID"
          minItems: 1
          description: One batch ID per delivery line, in the same order.
    Batch:
      type: object
      additionalProperties: false
      required:
        - batchID
        - deliveryID
        - lineNo
        - productID
        - manufacturedAt
        - shelfLife
        - receivedAt
        - expiresAt
        - receivedQuantity
        - remainingQuantity
      properties:
        batchID:
          $ref: "#/components/schemas/ID"
        deliveryID:
          $ref: "#/components/schemas/ID"
        lineNo:
          $ref: "#/components/schemas/PositiveInt64"
        productID:
          $ref: "#/components/schemas/ID"
        manufacturedAt:
          $ref: "#/components/schemas/MoscowTimestamp"
        shelfLife:
          $ref: "#/components/schemas/ShelfLife"
        receivedAt:
          $ref: "#/components/schemas/MoscowTimestamp"
        expiresAt:
          $ref: "#/components/schemas/MoscowTimestamp"
        receivedQuantity:
          $ref: "#/components/schemas/PositiveQuantity"
        remainingQuantity:
          $ref: "#/components/schemas/Quantity"
    ProductInventory:
      type: object
      description: Prepared inventory. quantity equals the sum of current batch remainingQuantity. This core-backed
        DTO has no product name; read the product catalog for display names.
      additionalProperties: false
      required:
        - productID
        - baseUnit
        - quantity
        - batches
      properties:
        productID:
          $ref: "#/components/schemas/ID"
        baseUnit:
          $ref: "#/components/schemas/BaseUnit"
        quantity:
          $ref: "#/components/schemas/Quantity"
        batches:
          type: array
          items:
            $ref: "#/components/schemas/Batch"
          minItems: 0
    ExpiringBatch:
      type: object
      description: Only positive prepared stock with expiresAt <= cutoffAt, sorted by expiresAt then batchID. Due
        expiry facts have already been applied. remainingSeconds=max(0,floor((expiresAt-evaluatedAt)/1s)).
      additionalProperties: false
      required:
        - batchID
        - productID
        - remainingQuantity
        - baseUnit
        - expiresAt
        - remainingSeconds
        - isExpired
      properties:
        batchID:
          $ref: "#/components/schemas/ID"
        productID:
          $ref: "#/components/schemas/ID"
        remainingQuantity:
          $ref: "#/components/schemas/PositiveQuantity"
        baseUnit:
          $ref: "#/components/schemas/BaseUnit"
        expiresAt:
          $ref: "#/components/schemas/MoscowTimestamp"
        remainingSeconds:
          $ref: "#/components/schemas/NonNegativeInt64"
        isExpired:
          type: boolean
          const: false
    RecommendationReason:
      type: object
      additionalProperties: false
      required:
        - productID
        - productName
        - batchID
        - quantityPerPortion
        - baseUnit
        - expiresAt
      properties:
        productID:
          $ref: "#/components/schemas/ID"
        productName:
          type: string
          minLength: 1
        batchID:
          $ref: "#/components/schemas/ID"
        quantityPerPortion:
          $ref: "#/components/schemas/PositiveQuantity"
        baseUnit:
          $ref: "#/components/schemas/BaseUnit"
        expiresAt:
          $ref: "#/components/schemas/MoscowTimestamp"
    Recommendation:
      type: object
      description: One independently available portion. priorityExpiresAt is the earliest expiry among its actual
        FEFO allocations. Include each allocation at that expiry with its actual quantity; sort reasons by
        productID then batchID.
      additionalProperties: false
      required:
        - dishID
        - dishName
        - priorityExpiresAt
        - reasons
      properties:
        dishID:
