components:
  schemas:
    ID:
      type: string
      minLength: 1
      description: Opaque identifier. Unicode and reserved characters are allowed. Percent-encode query values; do
        not require UUID syntax.
    ClientCommandID:
      type: string
      minLength: 1
      not:
        pattern: ^expiration/
      description: Caller-generated command identity. Preserve the same value and identical input on retry. The
        expiration/ namespace belongs to warehouse.
    PositiveInt64:
      type: string
      minLength: 1
      maxLength: 19
      pattern: ^(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$
      description: Canonical decimal integer from 1 through 9223372036854775807. No sign, leading zero, exponent or
        fractional part. Keep as a string or BigInt in JavaScript.
      examples:
        - "1"
        - "9007199254740993"
        - "9223372036854775807"
    NonNegativeInt64:
      type: string
      minLength: 1
      maxLength: 19
      pattern: ^(?:0|[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$
      description: Canonical decimal integer from 0 through 9223372036854775807. Preserve exact precision.
      examples:
        - "0"
        - "9007199254740993"
        - "9223372036854775807"
    PositiveQuantity:
      $ref: "#/components/schemas/PositiveInt64"
      description: Positive thousandths of the product base unit. "40000" is 40 g/ml/pcs; "500" is 0.5 g/ml/pcs.
    Quantity:
      $ref: "#/components/schemas/NonNegativeInt64"
      description: Nonnegative thousandths of the product base unit. "10000000" is 10 kg for baseUnit=g.
    MoscowTimestamp:
      type: string
      format: date-time
      pattern: ^\d{4}-\d{2}-\d{2}T(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.[0-9]{1,9})?\+03:00$
      description: Full RFC3339 timestamp with seconds and the +03:00 Moscow offset. Calendar dates must be valid.
        Date-only, Z, other offsets and leap seconds are rejected. Explicit midnight is valid.
      examples:
        - 2026-10-10T12:00:00+03:00
        - 2026-10-10T00:00:00+03:00
    BaseUnit:
      type: string
      enum:
        - g
        - ml
        - pcs
    ShelfLife:
      type: object
      description: day is exactly 24 hours. month uses the Moscow calendar and clips the day to the end of the
        target month. Warehouse calculates expiresAt once; duration/date overflow is InvalidArgument.
      additionalProperties: false
      required:
        - value
        - unit
      properties:
        value:
          $ref: "#/components/schemas/PositiveInt64"
        unit:
          type: string
          enum:
            - day
            - month
    Product:
      type: object
      additionalProperties: false
      required:
        - productID
        - name
        - baseUnit
      properties:
        productID:
          $ref: "#/components/schemas/ID"
        name:
          type: string
          minLength: 1
        baseUnit:
          $ref: "#/components/schemas/BaseUnit"
    IngredientInput:
      type: object
      additionalProperties: false
      required:
        - productID
        - quantity
      properties:
        productID:
          $ref: "#/components/schemas/ID"
        quantity:
          $ref: "#/components/schemas/PositiveQuantity"
        baseUnit:
          $ref: "#/components/schemas/BaseUnit"
          description: Optional assertion. If supplied, it must match the registered product. Omission lets warehouse
            obtain its base unit.
    Ingredient:
      type: object
      additionalProperties: false
      required:
        - productID
        - quantity
        - baseUnit
      properties:
        productID:
          $ref: "#/components/schemas/ID"
        quantity:
          $ref: "#/components/schemas/PositiveQuantity"
        baseUnit:
          $ref: "#/components/schemas/BaseUnit"
    RecordedIngredient:
      type: object
      additionalProperties: false
      required:
        - productID
        - quantity
      properties:
        productID:
          $ref: "#/components/schemas/ID"
        quantity:
          $ref: "#/components/schemas/PositiveQuantity"
    Dish:
      type: object
      description: Immutable definition. Ingredients remain in recipe order. Each productID occurs once. Wire
        ingredients maps to serving Recipe and warehouse Ingredients.
      additionalProperties: false
      required:
        - dishID
        - name
        - ingredients
      properties:
        dishID:
          $ref: "#/components/schemas/ID"
        name:
          type: string
          minLength: 1
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/Ingredient"
          minItems: 1
    RecordedDish:
      type: object
      description: Definition stored in the event. Base units belong to ProductRegistered facts; history does not
        enrich or reinterpret recorded data.
      additionalProperties: false
      required:
        - dishID
        - name
        - ingredients
      properties:
        dishID:
          $ref: "#/components/schemas/ID"
        name:
          type: string
          minLength: 1
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/RecordedIngredient"
          minItems: 1
    RegisterProductRequest:
      type: object
      additionalProperties: false
      required:
        - commandID
        - productID
        - name
        - baseUnit
      properties:
        commandID:
          $ref: "#/components/schemas/ClientCommandID"
        productID:
          $ref: "#/components/schemas/ID"
        name:
          type: string
          minLength: 1
        baseUnit:
          $ref: "#/components/schemas/BaseUnit"
    DefineDishRequest:
      type: object
      description: Creates a definition without replacing an existing dish. Ingredient productID values must be
        distinct and refer to registered products.
      additionalProperties: false
      required:
        - commandID
        - dishID
        - name
        - ingredients
      properties:
        commandID:
          $ref: "#/components/schemas/ClientCommandID"
        dishID:
          $ref: "#/components/schemas/ID"
        name:
          type: string
          minLength: 1
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/IngredientInput"
          minItems: 1
    MenuDish:
      type: object
      additionalProperties: false
      required:
        - dishID
        - name
      properties:
        dishID:
          $ref: "#/components/schemas/ID"
        name:
          type: string
          minLength: 1
    Deficit:
      type: object
      description: Required and available quantities at this position evaluation. availableQuantity is less than
        requiredQuantity.
      additionalProperties: false
      required:
        - productID
        - requiredQuantity
        - availableQuantity
      properties:
        productID:
          $ref: "#/components/schemas/ID"
        requiredQuantity:
          $ref: "#/components/schemas/PositiveQuantity"
        availableQuantity:
          $ref: "#/components/schemas/Quantity"
    StopListDish:
      type: object
      additionalProperties: false
      required:
        - dishID
        - name
        - deficits
      properties:
        dishID:
          $ref: "#/components/schemas/ID"
        name:
          type: string
          minLength: 1
        deficits:
          type: array
          items:
            $ref: "#/components/schemas/Deficit"
          minItems: 1
    RequestedPosition:
      type: object
      description: Input position. Serving assigns lineNo=1,2,... in array order. Repeated dishID values are allowed.
      additionalProperties: false
      required:
        - dishID
        - portions
      properties:
        dishID:
          $ref: "#/components/schemas/ID"
        portions:
          $ref: "#/components/schemas/PositiveInt64"
    Position:
      type: object
      description: Position with the original service-assigned line number. Do not renumber reductions or replacements.
      additionalProperties: false
      required:
        - lineNo
        - dishID
        - portions
      properties:
        lineNo:
          $ref: "#/components/schemas/PositiveInt64"
        dishID:
          $ref: "#/components/schemas/ID"
        portions:
          $ref: "#/components/schemas/PositiveInt64"
    Change:
      type: object
      description: One reduction or removal. acceptedPortions is less than requestedPortions; zero denotes removal.
        Changes retain input order.
      additionalProperties: false
      required:
        - lineNo
        - dishID
        - requestedPortions
        - acceptedPortions
        - deficits
      properties:
        lineNo:
          $ref: "#/components/schemas/PositiveInt64"
        dishID:
          $ref: "#/components/schemas/ID"
        requestedPortions:
          $ref: "#/components/schemas/PositiveInt64"
        acceptedPortions:
          $ref: "#/components/schemas/NonNegativeInt64"
        deficits:
          type: array
          items:
            $ref: "#/components/schemas/Deficit"
          minItems: 1
    Allocation:
      type: object
      description: Exact committed debit. Contains only recorded product/batch identity and quantity, without
        display enrichment.
      additionalProperties: false
      required:
        - productID
        - batchID
        - quantity
      properties:
        productID:
          $ref: "#/components/schemas/ID"
        batchID:
          $ref: "#/components/schemas/ID"
        quantity:
          $ref: "#/components/schemas/PositiveQuantity"
    Order:
      type: object
      description: Authoritative recorded order. Wire acceptedPositions maps to serving Order.Positions and
        warehouse Order.AcceptedPositions.
      additionalProperties: false
      required:
        - orderID
        - proposalID
        - acceptedPositions
        - allocations
        - placedAt
      properties:
        orderID:
          $ref: "#/components/schemas/ID"
        proposalID:
          $ref: "#/components/schemas/ID"
        acceptedPositions:
          type: array
          items:
            $ref: "#/components/schemas/Position"
          minItems: 1
        allocations:
          type: array
          items:
            $ref: "#/components/schemas/Allocation"
          minItems: 1
        placedAt:
          $ref: "#/components/schemas/MoscowTimestamp"
    OrderProposal:
      type: object
      description: Immutable proposal; preparation does not reserve or debit inventory. Empty acceptedPositions is
        valid. Replacements use the preceding acceptedPositions as requestedPositions, retain lineNo and never
        increase portions or restore removed positions.
      additionalProperties: false
      required:
        - proposalID
        - evaluatedAt
        - stateVersion
        - requestedPositions
        - acceptedPositions
        - changes
      properties:
        proposalID:
          $ref: "#/components/schemas/ID"
        evaluatedAt:
          $ref: "#/components/schemas/MoscowTimestamp"
        stateVersion:
          $ref: "#/components/schemas/NonNegativeInt64"
        requestedPositions:
          type: array
          items:
            $ref: "#/components/schemas/Position"
          minItems: 0
        acceptedPositions:
          type: array
          items:
            $ref: "#/components/schemas/Position"
          minItems: 0
        changes:
          type: array
          items:
            $ref: "#/components/schemas/Change"
          minItems: 0
    PrepareOrderRequest:
      type: object
      description: Process positions in source order. An empty list produces an empty proposal. Do not send lineNo
        or an accepted composition.
      additionalProperties: false
      required:
        - positions
      properties:
        positions:
          type: array
          items:
            $ref: "#/components/schemas/RequestedPosition"
          minItems: 0
    ConfirmOrderRequest:
      type: object
      description: Confirm only the saved accepted composition. Preserve both identities and the same JSON values
        after an unknown outcome. A replacement requires explicit user confirmation and a new commandID.
      additionalProperties: false
      required:
        - commandID
        - proposalID
      properties:
        commandID:
          $ref: "#/components/schemas/ClientCommandID"
        proposalID:
          $ref: "#/components/schemas/ID"
    DeliveryLine:
      type: object
      description: One source line creates one batch. manufacturedAt <= receivedAt <= operation time. Line numbers
        and batchIDs are assigned by warehouse; expiresAt is not caller input.
      additionalProperties: false
      required:
        - productID
        - manufacturedAt
        - shelfLife
        - receivedAt
        - quantity
      properties:
        productID:
          $ref: "#/components/schemas/ID"
        manufacturedAt:
          $ref: "#/components/schemas/MoscowTimestamp"
        shelfLife:
          $ref: "#/components/schemas/ShelfLife"
        receivedAt:
          $ref: "#/components/schemas/MoscowTimestamp"
        quantity:
          $ref: "#/components/schemas/PositiveQuantity"
    ReceiveDeliveryRequest:
      type: object
      description: Validate the entire delivery before intake facts. deliveryID is unique independently of
        commandID. Exact retries return the original receipt; a new commandID for the same deliveryID is a
        conflict. Already expired intake is atomically received and written off.
      additionalProperties: false
      required:
        - commandID
        - deliveryID
        - number
        - createdAt
        - lines
      properties:
        commandID:
          $ref: "#/components/schemas/ClientCommandID"
        deliveryID:
          $ref: "#/components/schemas/ID"
        number:
          type: string
          minLength: 1
          description: Delivery number, displayed as Номер поставки. It is not unique.
        createdAt:
          $ref: "#/components/schemas/MoscowTimestamp"
          description: Date and time of delivery creation (Дата и время создания поставки). Required and no later than
            operation time.
        lines:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryLine"
          minItems: 1
    Delivery:
      type: object
      additionalProperties: false
      required:
        - deliveryID
        - number
        - createdAt
        - lines
      properties:
        deliveryID:
          $ref: "#/components/schemas/ID"
        number:
          type: string
          minLength: 1
        createdAt:
          $ref: "#/components/schemas/MoscowTimestamp"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryLine"
          minItems: 1
    DeliveryReceipt:
      type: object
      additionalProperties: false
      required:
        - deliveryID
        - batchIDs
      properties:
        deliveryID:
          $ref: "#/components/schemas/ID"
        batchIDs:
          type: array
          items:
            $ref: "#/components/schemas/ID"
          minItems: 1
          description: One batch ID per delivery line, in the same order.
    Batch:
      type: object
      additionalProperties: false
      required:
        - batchID
        - deliveryID
        - lineNo
        - productID
        - manufacturedAt
        - shelfLife
        - receivedAt
        - expiresAt
        - receivedQuantity
        - remainingQuantity
      properties:
        batchID:
          $ref: "#/components/schemas/ID"
        deliveryID:
          $ref: "#/components/schemas/ID"
        lineNo:
          $ref: "#/components/schemas/PositiveInt64"
        productID:
          $ref: "#/components/schemas/ID"
        manufacturedAt:
          $ref: "#/components/schemas/MoscowTimestamp"
        shelfLife:
          $ref: "#/components/schemas/ShelfLife"
        receivedAt:
          $ref: "#/components/schemas/MoscowTimestamp"
        expiresAt:
          $ref: "#/components/schemas/MoscowTimestamp"
        receivedQuantity:
          $ref: "#/components/schemas/PositiveQuantity"
        remainingQuantity:
          $ref: "#/components/schemas/Quantity"
    ProductInventory:
      type: object
      description: Prepared inventory. quantity equals the sum of current batch remainingQuantity. This core-backed
        DTO has no product name; read the product catalog for display names.
      additionalProperties: false
      required:
        - productID
        - baseUnit
        - quantity
        - batches
      properties:
        productID:
          $ref: "#/components/schemas/ID"
        baseUnit:
          $ref: "#/components/schemas/BaseUnit"
        quantity:
          $ref: "#/components/schemas/Quantity"
        batches:
          type: array
          items:
            $ref: "#/components/schemas/Batch"
          minItems: 0
    ExpiringBatch:
      type: object
      description: Only positive prepared stock with expiresAt <= cutoffAt, sorted by expiresAt then batchID. Due
        expiry facts have already been applied. remainingSeconds=max(0,floor((expiresAt-evaluatedAt)/1s)).
      additionalProperties: false
      required:
        - batchID
        - productID
        - remainingQuantity
        - baseUnit
        - expiresAt
        - remainingSeconds
        - isExpired
      properties:
        batchID:
          $ref: "#/components/schemas/ID"
        productID:
          $ref: "#/components/schemas/ID"
        remainingQuantity:
          $ref: "#/components/schemas/PositiveQuantity"
        baseUnit:
          $ref: "#/components/schemas/BaseUnit"
        expiresAt:
          $ref: "#/components/schemas/MoscowTimestamp"
        remainingSeconds:
          $ref: "#/components/schemas/NonNegativeInt64"
        isExpired:
          type: boolean
          const: false
    RecommendationReason:
      type: object
      additionalProperties: false
      required:
        - productID
        - productName
        - batchID
        - quantityPerPortion
        - baseUnit
        - expiresAt
      properties:
        productID:
          $ref: "#/components/schemas/ID"
        productName:
          type: string
          minLength: 1
        batchID:
          $ref: "#/components/schemas/ID"
        quantityPerPortion:
          $ref: "#/components/schemas/PositiveQuantity"
        baseUnit:
          $ref: "#/components/schemas/BaseUnit"
        expiresAt:
          $ref: "#/components/schemas/MoscowTimestamp"
    Recommendation:
      type: object
      description: One independently available portion. priorityExpiresAt is the earliest expiry among its actual
        FEFO allocations. Include each allocation at that expiry with its actual quantity; sort reasons by
        productID then batchID.
      additionalProperties: false
      required:
        - dishID
        - dishName
        - priorityExpiresAt
        - reasons
      properties:
        dishID:
          $ref: "#/components/schemas/ID"
        dishName:
          type: string
          minLength: 1
        priorityExpiresAt:
          $ref: "#/components/schemas/MoscowTimestamp"
        reasons:
          type: array
          items:
            $ref: "#/components/schemas/RecommendationReason"
          minItems: 1
    ExpiryResult:
      type: object
      additionalProperties: false
      required:
        - batchID
        - productID
        - writtenOffQuantity
        - reason
        - expiresAt
        - processedAt
      properties:
        batchID:
          $ref: "#/components/schemas/ID"
        productID:
          $ref: "#/components/schemas/ID"
        writtenOffQuantity:
          $ref: "#/components/schemas/PositiveQuantity"
        reason:
          type: string
          const: EXPIRATION
        expiresAt:
          $ref: "#/components/schemas/MoscowTimestamp"
        processedAt:
          $ref: "#/components/schemas/MoscowTimestamp"
    Products:
      type: object
      additionalProperties: false
      required:
        - evaluatedAt
        - stateVersion
        - items
      properties:
        evaluatedAt:
          $ref: "#/components/schemas/MoscowTimestamp"
        stateVersion:
          $ref: "#/components/schemas/NonNegativeInt64"
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
          minItems: 0
    DishCatalog:
      type: object
      additionalProperties: false
      required:
        - evaluatedAt
        - stateVersion
        - items
      properties:
        evaluatedAt:
          $ref: "#/components/schemas/MoscowTimestamp"
        stateVersion:
          $ref: "#/components/schemas/NonNegativeInt64"
        items:
          type: array
          items:
            $ref: "#/components/schemas/Dish"
          minItems: 0
    Menu:
      type: object
      additionalProperties: false
      required:
        - evaluatedAt
        - stateVersion
        - dishes
      properties:
        evaluatedAt:
          $ref: "#/components/schemas/MoscowTimestamp"
        stateVersion:
          $ref: "#/components/schemas/NonNegativeInt64"
        dishes:
          type: array
          items:
            $ref: "#/components/schemas/MenuDish"
          minItems: 0
      description: Dishes available for one portion, sorted by dishID. No available-portion count. Each dish is
        evaluated independently; this list does not promise joint order availability.
    StopList:
      type: object
      additionalProperties: false
      required:
        - evaluatedAt
        - stateVersion
        - dishes
      properties:
        evaluatedAt:
          $ref: "#/components/schemas/MoscowTimestamp"
        stateVersion:
          $ref: "#/components/schemas/NonNegativeInt64"
        dishes:
          type: array
          items:
            $ref: "#/components/schemas/StopListDish"
          minItems: 0
      description: Dishes unavailable for one portion. Menu and stop-list complement each other only for the same
        evaluatedAt/stateVersion. Independent requests may capture different versions.
    Recommendations:
      type: object
      additionalProperties: false
      required:
        - evaluatedAt
        - stateVersion
        - items
      properties:
        evaluatedAt:
          $ref: "#/components/schemas/MoscowTimestamp"
        stateVersion:
          $ref: "#/components/schemas/NonNegativeInt64"
        items:
          type: array
          items:
            $ref: "#/components/schemas/Recommendation"
          minItems: 0
      description: All independently available dishes, ordered by priorityExpiresAt then dishID. No urgency window
        or stock threshold.
    Inventory:
      type: object
      additionalProperties: false
      required:
        - evaluatedAt
        - stateVersion
        - products
      properties:
        evaluatedAt:
          $ref: "#/components/schemas/MoscowTimestamp"
        stateVersion:
          $ref: "#/components/schemas/NonNegativeInt64"
        products:
          type: array
          items:
            $ref: "#/components/schemas/ProductInventory"
          minItems: 0
    ExpiringBatches:
      type: object
      additionalProperties: false
      required:
        - evaluatedAt
        - stateVersion
        - items
      properties:
        evaluatedAt:
          $ref: "#/components/schemas/MoscowTimestamp"
        stateVersion:
          $ref: "#/components/schemas/NonNegativeInt64"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExpiringBatch"
          minItems: 0
    History:
      type: object
      additionalProperties: false
      required:
        - evaluatedAt
        - stateVersion
        - events
      properties:
        evaluatedAt:
          $ref: "#/components/schemas/MoscowTimestamp"
        stateVersion:
          $ref: "#/components/schemas/NonNegativeInt64"
        events:
          type: array
          items:
            $ref: "#/components/schemas/HistoryEvent"
          minItems: 0
      description: Recorded facts in contiguous sequence order, without pagination. Does not require current expiry
        preparation. Empty history has stateVersion="0" and events=[].
    DishDetails:
      type: object
      additionalProperties: false
      required:
        - evaluatedAt
        - stateVersion
        - dish
      properties:
        evaluatedAt:
          $ref: "#/components/schemas/MoscowTimestamp"
        stateVersion:
          $ref: "#/components/schemas/NonNegativeInt64"
        dish:
          $ref: "#/components/schemas/Dish"
    OrderConfirmed:
      type: object
      additionalProperties: false
      required:
        - kind
        - order
      properties:
        kind:
          type: string
          const: OrderConfirmed
        order:
          $ref: "#/components/schemas/Order"
    RequiresConfirmation:
      type: object
      additionalProperties: false
      required:
        - kind
        - proposal
      properties:
        kind:
          type: string
          const: RequiresConfirmation
        proposal:
          $ref: "#/components/schemas/OrderProposal"
    EmptyOrder:
      type: object
      additionalProperties: false
      required:
        - kind
      properties:
        kind:
          type: string
          const: EmptyOrder
    ProposalSuperseded:
      type: object
      additionalProperties: false
      required:
        - kind
        - supersededBy
      properties:
        kind:
          type: string
          const: ProposalSuperseded
        supersededBy:
          $ref: "#/components/schemas/ID"
    ConfirmationPending:
      type: object
      additionalProperties: false
      required:
        - kind
      properties:
        kind:
          type: string
          const: ConfirmationPending
      description: The original attempt remains unresolved. It does not establish a sale or terminal refusal. A
        different commandID must not start a competing sale.
    ConfirmCompleted:
      oneOf:
        - $ref: "#/components/schemas/OrderConfirmed"
        - $ref: "#/components/schemas/RequiresConfirmation"
        - $ref: "#/components/schemas/EmptyOrder"
      discriminator:
        propertyName: kind
        mapping:
          OrderConfirmed: "#/components/schemas/OrderConfirmed"
          RequiresConfirmation: "#/components/schemas/RequiresConfirmation"
          EmptyOrder: "#/components/schemas/EmptyOrder"
    ConfirmResult:
      oneOf:
        - $ref: "#/components/schemas/OrderConfirmed"
        - $ref: "#/components/schemas/RequiresConfirmation"
        - $ref: "#/components/schemas/EmptyOrder"
        - $ref: "#/components/schemas/ProposalSuperseded"
        - $ref: "#/components/schemas/ConfirmationPending"
      discriminator:
        propertyName: kind
        mapping:
          OrderConfirmed: "#/components/schemas/OrderConfirmed"
          RequiresConfirmation: "#/components/schemas/RequiresConfirmation"
          EmptyOrder: "#/components/schemas/EmptyOrder"
          ProposalSuperseded: "#/components/schemas/ProposalSuperseded"
          ConfirmationPending: "#/components/schemas/ConfirmationPending"
      description: Only the active payload is allowed. Unknown kind, absent required payload, extra inactive
        payload, wrong content type or malformed JSON is a protocol error. For a modifying request its outcome
        remains unknown.
    ProductRegisteredEvent:
      type: object
      description: Immutable journal fact. No nullable or unrelated payload fields. Replay uses recorded facts
        without recalculation.
      additionalProperties: false
      required:
        - eventID
        - streamID
        - sequence
        - schemaVersion
        - commandID
        - commandFingerprint
        - recordedAt
        - type
        - payload
      properties:
        eventID:
          $ref: "#/components/schemas/ID"
        streamID:
          type: string
          const: inventory
        sequence:
          $ref: "#/components/schemas/PositiveInt64"
        schemaVersion:
          type: integer
          const: 1
        commandID:
          $ref: "#/components/schemas/ID"
        commandFingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
        recordedAt:
          $ref: "#/components/schemas/MoscowTimestamp"
        type:
          type: string
          const: ProductRegistered
        payload:
          type: object
          additionalProperties: false
          required:
            - product
          properties:
            product:
              $ref: "#/components/schemas/Product"
    DishDefinedEvent:
      type: object
      description: Immutable journal fact. No nullable or unrelated payload fields. Replay uses recorded facts
        without recalculation.
      additionalProperties: false
      required:
        - eventID
        - streamID
        - sequence
        - schemaVersion
        - commandID
        - commandFingerprint
        - recordedAt
        - type
        - payload
      properties:
        eventID:
          $ref: "#/components/schemas/ID"
        streamID:
          type: string
          const: inventory
        sequence:
          $ref: "#/components/schemas/PositiveInt64"
        schemaVersion:
          type: integer
          const: 1
        commandID:
          $ref: "#/components/schemas/ID"
        commandFingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
        recordedAt:
          $ref: "#/components/schemas/MoscowTimestamp"
        type:
          type: string
          const: DishDefined
        payload:
          type: object
          additionalProperties: false
          required:
            - dish
          properties:
            dish:
              $ref: "#/components/schemas/RecordedDish"
    DeliveryReceivedEvent:
      type: object
      description: Immutable journal fact. No nullable or unrelated payload fields. Replay uses recorded facts
        without recalculation.
      additionalProperties: false
      required:
        - eventID
        - streamID
        - sequence
        - schemaVersion
        - commandID
        - commandFingerprint
        - recordedAt
        - type
        - payload
      properties:
        eventID:
          $ref: "#/components/schemas/ID"
        streamID:
          type: string
          const: inventory
        sequence:
          $ref: "#/components/schemas/PositiveInt64"
        schemaVersion:
          type: integer
          const: 1
        commandID:
          $ref: "#/components/schemas/ID"
        commandFingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
        recordedAt:
          $ref: "#/components/schemas/MoscowTimestamp"
        type:
          type: string
          const: DeliveryReceived
        payload:
          type: object
          additionalProperties: false
          required:
            - delivery
            - batches
          properties:
            delivery:
              $ref: "#/components/schemas/Delivery"
            batches:
              type: array
              items:
                $ref: "#/components/schemas/Batch"
              minItems: 1
    OrderPlacedEvent:
      type: object
      description: Immutable journal fact. No nullable or unrelated payload fields. Replay uses recorded facts
