    OperatorProfile:
      type: object
      additionalProperties: false
      required:
        - id
        - login
        - displayName
      properties:
        id:
          type: string
          minLength: 1
          description: Stable opaque profile ID; not the login.
        login:
          type: string
          minLength: 1
          description: Immutable login identifier; it does not imply an email address.
        displayName:
          type: string
          minLength: 2
          maxLength: 80
          description: Trimmed NFC display name of 2 to 80 Unicode code points.
    OperatorSession:
      type: object
      description: Session deadlines and the session's CSRF token. The session ID is never in JSON.
      additionalProperties: false
      required:
        - expiresAt
        - idleExpiresAt
        - absoluteExpiresAt
        - rememberMe
        - csrfToken
      properties:
        expiresAt:
          $ref: "#/components/schemas/MoscowTimestamp"
          description: The earlier of the idle and absolute deadlines; equal to idleExpiresAt.
        idleExpiresAt:
          $ref: "#/components/schemas/MoscowTimestamp"
          description: Moves with authenticated requests of an ordinary session (30 minutes), never past
            absoluteExpiresAt. A remembered session has no earlier idle deadline.
        absoluteExpiresAt:
          $ref: "#/components/schemas/MoscowTimestamp"
          description: Fixed at login, 8 hours for an ordinary session and 30 days for a remembered one.
        rememberMe:
          type: boolean
        csrfToken:
          type: string
          minLength: 1
    OperatorView:
      type: object
      additionalProperties: false
      required:
        - operator
        - session
      properties:
        operator:
          $ref: "#/components/schemas/OperatorProfile"
        session:
          $ref: "#/components/schemas/OperatorSession"
    OperatorProfileView:
      type: object
      additionalProperties: false
      required:
        - operator
      properties:
        operator:
          $ref: "#/components/schemas/OperatorProfile"
    CsrfTokenView:
      type: object
      additionalProperties: false
      required:
        - csrfToken
      properties:
        csrfToken:
          type: string
          minLength: 1
    SignInRequest:
      type: object
      description: Exact case-sensitive fields; unknown fields are rejected.
      additionalProperties: false
      required:
        - login
        - password
      properties:
        login:
          type: string
        password:
          type: string
          description: Sent as typed; never trimmed or normalized.
        rememberMe:
          type: boolean
          default: false
          description: true opens a fixed 30-day session; activity never extends it.
    DisplayNameRequest:
      type: object
      additionalProperties: false
      required:
        - displayName
      properties:
        displayName:
          type: string
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          maxLength: 32
          description: Sent as typed; never trimmed or normalized. Outside an active cooldown and after newPassword
            passes field validation, a value over 32 Unicode code points is rejected before credential
            verification without consuming the failed-check counter or revoking a session.
        newPassword:
          type: string
          description: 8 to 32 Unicode code points; not trimmed, normalized or truncated.
    OperatorError:
      type: object
      description: Gateway-owned error of the account routes, the business-route guard and the feedback boundary,
        with Cache-Control no-store. Transport failures keep GatewayReadError and GatewayWriteError. Choose the
        user text by code and fieldErrors codes; message is for logs and developers.
      additionalProperties: false
      required:
        - code
        - message
        - requestID
      if:
        required:
          - code
        properties:
          code:
            const: PasswordChangeRateLimited
      then:
        required:
          - sessionRevoked
      else:
        not:
          required:
            - sessionRevoked
      properties:
        code:
          type: string
          enum:
            - InvalidRequest
            - InvalidCredentials
            - Unauthenticated
            - InvalidOrigin
            - InvalidCsrfToken
            - CurrentPasswordIncorrect
            - NotFound
            - MethodNotAllowed
            - PayloadTooLarge
            - UnsupportedMediaType
            - InvalidDisplayName
            - PasswordRejected
            - LoginRateLimited
            - PasswordChangeRateLimited
            - FeedbackRateLimited
            - AuthUnavailable
            - SessionStorageUnavailable
            - SessionUpdateOutcomeUnknown
            - AccountStorageUnavailable
            - AccountUpdateOutcomeUnknown
        message:
          type: string
          minLength: 1
          description: Human-readable detail. Do not use it as a machine code.
        fieldErrors:
          type: object
          description: Only on 422; maps the rejected field to its stable code.
          additionalProperties:
            type: string
            enum:
              - Required
              - TooShort
              - TooLong
              - InvalidFormat
              - InvalidCharacters
        requestID:
          type: string
          minLength: 1
          description: The ID the gateway also writes to its log.
        sessionRevoked:
          type: boolean
          description: Only on PasswordChangeRateLimited. true means this response revoked the calling session and
            stored the revocation; false means it revoked nothing. Never true when the revocation was not stored.
    FeedbackSubmission:
      type: object
      x-implementation-status: planned
      description: Owned by the umir-feedback service (umir-feedback#1); the gateway only checks that the body is
        one JSON object of at most 16 KiB. A non-empty website is a trap that answers a plausible 201 and stores
        nothing.
      additionalProperties: false
      required:
        - submissionID
        - name
        - email
        - message
        - consent
      properties:
        submissionID:
          type: string
          format: uuid
          pattern: '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-4[0-9A-Fa-f]{3}-[89aAbB][0-9A-Fa-f]{3}-[0-9A-Fa-f]{12}$'
          description: UUID v4 generated by the client; repeat it with identical content after an unknown outcome.
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed NFC, 1 to 100 code points without control characters.
        email:
          type: string
          maxLength: 254
          description: A single unquoted address at most 254 UTF-8 bytes; only the domain is normalized to lowercase.
        phone:
          type: string
          maxLength: 32
          description: Optional; digits, space, +, -, ( and ), with 10 to 15 digits.
        message:
          type: string
          minLength: 1
          maxLength: 2000
          description: Trimmed, 1 to 2000 code points; line breaks and tabs are kept.
        consent:
          type: object
          additionalProperties: false
          required:
            - accepted
            - documentVersion
          properties:
            accepted:
              type: boolean
              const: true
            documentVersion:
              type: string
              minLength: 1
              maxLength: 128
        website:
          type: string
          description: Must stay empty; the form hides it from people.
    FeedbackReceipt:
      type: object
      x-implementation-status: planned
      additionalProperties: false
      required:
        - submissionID
        - receivedAt
      properties:
        submissionID:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        receivedAt:
          $ref: "#/components/schemas/MoscowTimestamp"
    FeedbackError:
      type: object
      description: Error returned by the private umir-feedback service without gateway rewriting. Responses use Cache-Control no-store.
      additionalProperties: false
      required:
        - code
        - message
        - requestID
      properties:
        code:
          type: string
          enum:
            - InvalidRequest
            - InvalidFeedback
            - ConsentRequired
            - SubmissionIdentityConflict
            - FeedbackStorageUnavailable
        message:
          type: string
          minLength: 1
          description: Human-readable detail. Do not use it as a machine code.
        fieldErrors:
          type: object
          description: Present for field and consent validation errors.
          additionalProperties:
            type: string
            enum:
              - Required
              - TooShort
              - TooLong
              - InvalidFormat
              - InvalidCharacters
              - ConsentRequired
              - ConsentOutdated
        requestID:
          type: string
          minLength: 1
    InvalidArgumentError:
      type: object
      description: Invalid request rejected before writing this attempt. Arithmetic overflow and unsupported units
