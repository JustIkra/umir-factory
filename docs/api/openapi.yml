    HistoryEvent:
      oneOf:
        - $ref: "#/components/schemas/ProductRegisteredEvent"
        - $ref: "#/components/schemas/DishDefinedEvent"
        - $ref: "#/components/schemas/DeliveryReceivedEvent"
        - $ref: "#/components/schemas/OrderPlacedEvent"
        - $ref: "#/components/schemas/BatchExpiredEvent"
      discriminator:
        propertyName: type
        mapping:
          ProductRegistered: "#/components/schemas/ProductRegisteredEvent"
          DishDefined: "#/components/schemas/DishDefinedEvent"
          DeliveryReceived: "#/components/schemas/DeliveryReceivedEvent"
          OrderPlaced: "#/components/schemas/OrderPlacedEvent"
          BatchExpired: "#/components/schemas/BatchExpiredEvent"
    InvalidArgumentError:
      type: object
      description: Invalid request rejected before writing this attempt. Arithmetic overflow and unsupported units
        are invalid arguments. Does not resolve a separate earlier unknown attempt.
      additionalProperties: false
      required:
        - code
        - message
        - outcome
      properties:
        code:
          type: string
          enum:
            - InvalidArgument
        message:
          type: string
          minLength: 1
          description: Human-readable detail. Do not use it as a machine code. Do not expose credentials or internal
            upstream URLs.
        outcome:
          type: string
          enum:
            - not_committed
    ReadInvalidArgumentError:
