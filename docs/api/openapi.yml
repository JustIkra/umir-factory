  /api/serving/order-confirmations:
    post:
      tags:
        - Orders
      operationId: confirmOrder
      summary: Confirm the accepted composition of a saved proposal
      x-implementation-status: target-http-contract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmOrderRequest"
            example:
              commandID: confirm-1
              proposalID: proposal-1
      responses:
        "200":
          description: Typed completed result, including exact idempotent replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmCompleted"
              examples:
                OrderConfirmed:
                  value:
                    kind: OrderConfirmed
                    order:
                      orderID: order-1
                      proposalID: proposal-1
                      acceptedPositions:
                        - lineNo: "1"
                          dishID: паста/+ &?
                          portions: "1"
                      allocations:
                        - productID: сыр/+ &?
                          batchID: batch-1
                          quantity: "40000"
                      placedAt: 2026-10-10T12:00:00+03:00
                RequiresConfirmation:
                  value:
                    kind: RequiresConfirmation
                    proposal:
                      proposalID: proposal-1
                      evaluatedAt: 2026-10-10T12:00:00+03:00
                      stateVersion: "9007199254740993"
                      requestedPositions:
                        - lineNo: "1"
                          dishID: паста/+ &?
                          portions: "1"
                      acceptedPositions:
                        - lineNo: "1"
                          dishID: паста/+ &?
                          portions: "1"
                      changes: []
                EmptyOrder:
                  value:
                    kind: EmptyOrder
        "202":
          description: Original attempt remains pending; no new sale is started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmationPending"
              example:
                kind: ConfirmationPending
        "400":
          description: "InvalidArgument: invalid fields, units, precision, dates or overflow."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidArgumentError"
              example:
                code: InvalidArgument
                message: "InvalidArgument: invalid fields, units, precision, dates or overflow."
                outcome: not_committed
        "404":
          description: Proposal not found. This does not prove absence of an earlier sale.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalNotFoundError"
              example:
                code: ProposalNotFound
                message: Proposal not found. This does not prove absence of an earlier sale.
                outcome: not_committed
        "409":
