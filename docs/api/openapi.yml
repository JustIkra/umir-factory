openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Umir gateway API
  version: 1.0.0-draft.4
  description: "Public wire contract v1 for frontend → gateway → serving/warehouse HTTP. This revision
    describes the implemented local HTTP sources; the selected factory images serve the
    HTTP API. Use the factory README development build instructions for the current checkouts.
    Business state and confirmation attempts are process-local; restart recovery and durable storage are
    outside this stage. Definitions are immutable. Editing, history pagination, document upload/OCR, roles,
    several operators and multiple restaurants are outside this version. Revision 1.0.0-draft.4 adds the
    single-operator account API with server sessions and CSRF (gateway#8), the gateway guard of every business
    route, and the public feedback route (gateway#10). They are implemented in candidate gateway and frontend
    sources (x-implementation-status implemented-candidate) and served by the one-port auth candidate
    assembly (compose.auth.yaml); the selected images keep the draft.2 behaviour without authentication until
    the coordinated pin update. All business bodies use
    application/json. Unknown tagged results and invalid response bodies are protocol failures, never
    proof of a sale. API revision is separate from service releases and exact factory image SHA pins.
    Source rules: [gateway handoff](../gateway-frontend-handoff.md) and [business
    core](../business-core.md)."
servers:
  - url: /
    description: Same-origin gateway via frontend reverse proxy.
  - url: http://127.0.0.1:8081
    description: Selected assembly only. The auth candidate publishes no gateway port; browsers and
      acceptance use the frontend origin.
security: []
tags:
  - name: Catalog
    description: Immutable product and dish definitions.
  - name: Availability
    description: Independent warehouse evaluations, with captured time and version.
  - name: Orders
    description: Immutable proposals and explicit confirmation.
  - name: Warehouse
    description: Atomic delivery intake, prepared stock and recorded history.
  - name: Health
    description: Process health only.
  - name: Operator
    description: The single operator's sign-in, session, profile and password.
  - name: Feedback
    description: Public feedback form; the private umir-feedback service owns its content.
x-wire-version: 1
x-timezone: Europe/Moscow
x-core-source-revisions:
  warehouse: 3e37af2f74a498c425c2dcb561be1bd3c9c01160
  serving: 0fb867e7ff58e3106fa819355fc1ee298da58074
x-adapter-rules:
  - Gateway guard (auth assembly). Every business route except GET/HEAD health needs the operator session
    cookie. POST, PUT, PATCH and DELETE also need the exact configured Origin, Sec-Fetch-Site same-origin when
    sent, and the session token in X-CSRF-Token. Rejections (401 Unauthenticated, 403 InvalidOrigin or
    InvalidCsrfToken, 405 MethodNotAllowed, 503 AuthUnavailable) use OperatorError and never reach the
    service, so the request did not run; repeat it after sign-in with the same commandID. Business requests
    extend an ordinary session's idle deadline. Gateway strips its cookies and X-CSRF-Token before a service
    and drops service Set-Cookie lines for them.
  - Normalize serving Recipe to wire ingredients and serving Order.Positions to acceptedPositions. History
    uses recorded fields, not enriched DTOs.
  - Convert int/int64 to canonical decimal strings with checked range conversion. Omitted optional ingredient
    baseUnit maps to the empty Go hint.
  - Encode all required empty collections as []; do not emit null. Reject unknown/inactive payload fields.
  - Gateway strips /api/serving or /api/warehouse and preserves method, remaining path, query, body,
    end-to-end headers and received upstream status/body. Gateway does not calculate business decisions,
    fingerprints or command IDs.
  - Service error codes are stable PascalCase wire values, not Go error text. Inspect payload and explicit
    outcome. Only the operation owner may establish not_committed; transport failure remains unknown for every
    POST.
  - A schema cannot prove relational business invariants, product uniqueness by key, time ordering, aggregate
    overflow, FEFO or late-write prevention. Owners must check these documented conditions.
  - Business query keys are case-sensitive. Reject undeclared, duplicate or malformed query values and
    raw semicolon separators. Serving also rejects an empty forced query. Percent-encode reserved
    characters in opaque IDs and the +03:00 offset.
  - POST bodies require application/json and strict UTF-8 JSON with exact case-sensitive fields. Reject
    duplicate keys, null, unknown fields, inactive payloads and a second JSON value. The default
    request-body limit is 1 MiB. Invalid media type or an oversized body receives 400 InvalidArgument
    when a response can be delivered.
  - A read validation error has outcome unavailable. Rejected modifying input has outcome not_committed
    for that input only. Invalid Resolve input has outcome unknown for the original confirmation; a
    separately saved owner refusal can still be replayed as not_committed.
  - Order preparation first evaluates stock through the non-mutating warehouse POST /order-evaluations.
    Its authoritative read errors use unavailable; no proposal is created. Transport failure remains
    unknown. Repeating a successful preparation creates a new proposal ID.
paths:
  /api/serving/products:
    get:
      tags:
        - Catalog
      operationId: getProducts
      summary: List all registered products
      x-implementation-status: implemented-http
      security:
        - operatorSession: []
      responses:
        "200":
          description: Typed successful result. Empty collections remain JSON arrays.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Products"
              example:
                evaluatedAt: 2026-10-10T12:00:00+03:00
                stateVersion: "9007199254740993"
                items:
                  - productID: сыр/+ &?
                    name: Сыр
                    baseUnit: g
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          description: Unexpected service failure; no successful query result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadTechnicalError"
              example:
                code: InternalError
                message: Unexpected service failure; no successful query result.
                outcome: unavailable
        "502":
          description: Upstream unavailable or transport/protocol failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayReadError"
              example:
                code: UpstreamUnavailable
                message: Upstream unavailable or transport/protocol failure.
                outcome: unavailable
        "503":
          description: Current inventory/definition version cannot be prepared or read.
            In the auth assembly, fail-closed recovery answers OperatorError AuthUnavailable without dispatch.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReadUnavailableError"
                  - $ref: "#/components/schemas/OperatorError"
              example:
                code: InventoryUnavailable
                message: Current inventory/definition version cannot be prepared or read.
                outcome: unavailable
        "504":
          description: Finite upstream timeout.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayReadError"
              example:
                code: UpstreamTimeout
                message: Finite upstream timeout.
                outcome: unavailable
        "400":
          description: Invalid or undeclared query input; no successful query result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadInvalidArgumentError"
              example:
                code: InvalidArgument
                message: Request query is invalid.
                outcome: unavailable
    post:
      tags:
        - Catalog
      operationId: registerProduct
      summary: Register an immutable product
      x-implementation-status: implemented-http
      security:
        - operatorSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterProductRequest"
            example:
              commandID: register-1
              productID: сыр/+ &?
              name: Сыр
              baseUnit: g
      responses:
        "200":
          description: Typed completed result, including exact idempotent replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
              example:
                productID: сыр/+ &?
                name: Сыр
                baseUnit: g
        "400":
          description: "InvalidArgument: invalid fields, units, precision, dates or overflow."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidArgumentError"
              example:
                code: InvalidArgument
                message: "InvalidArgument: invalid fields, units, precision, dates or overflow."
                outcome: not_committed
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "409":
          description: Definite identity, immutable definition or unique delivery conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductConflictError"
              example:
                code: CommandIdentityConflict
                message: Definite identity, immutable definition or unique delivery conflict.
                outcome: not_committed
        "500":
          description: Technical failure with unknown write outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteTechnicalError"
              example:
                code: InternalError
                message: Technical failure with unknown write outcome.
                outcome: unknown
        "502":
          description: Upstream unavailable or transport failure; outcome unknown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayWriteError"
              example:
                code: UpstreamUnavailable
                message: Upstream unavailable or transport failure; outcome unknown.
                outcome: unknown
        "503":
          description: Inventory is unavailable; the operation outcome remains unknown. This status does not
            establish a terminal refusal.
            In the auth assembly, fail-closed recovery answers OperatorError AuthUnavailable without dispatch.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/InventoryUnavailableError"
                  - $ref: "#/components/schemas/OperatorError"
              example:
                code: InventoryUnavailable
                message: Inventory is unavailable; the operation outcome remains unknown.
                outcome: unknown
        "504":
          description: Upstream timeout; outcome unknown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayWriteError"
              example:
                code: UpstreamTimeout
                message: Upstream timeout; outcome unknown.
                outcome: unknown
