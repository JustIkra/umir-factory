        schemaVersion:
          type: integer
          const: 1
        commandID:
          $ref: "#/components/schemas/ID"
        commandFingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
        recordedAt:
          $ref: "#/components/schemas/MoscowTimestamp"
        type:
          type: string
          const: BatchExpired
        payload:
